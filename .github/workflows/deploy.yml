name: Test Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test / Typecheck / Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: SW 缓存一致性门禁（改动文件后必须 sync-sw）
        run: node scripts/sync-sw.js --check

  e2e:
    name: E2E Smoke (三端：Chromium 桌面 + WebKit 手机/平板)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
