name: Test Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test / Typecheck / Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: SW 缓存一致性门禁（改动文件后必须 sync-sw）
        run: node scripts/sync-sw.js --check

  e2e:
    name: E2E Smoke (三端：Chromium 桌面 + WebKit 手机/平板)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
