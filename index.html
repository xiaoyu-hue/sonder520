<body>
  <div id="wallpaperLayer" aria-hidden="true"><img id="wallpaperImg" alt="" draggable="false"></div>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand"><span class="dot"></span>Sonder</div>
      <ul class="nav" id="nav"></ul>
    </aside>
    <div class="main">
      <header class="topbar">
        <span class="title" id="pageTitle">首页总览</span>
        <div class="gsearch" id="gsearch">
          <span class="gsearch-ico" aria-hidden="true">🔍</span>
          <input id="globalSearch" type="search" autocomplete="off" placeholder="全局搜索…" aria-label="全局搜索">
          <div class="gsearch-panel" id="gsearchPanel" hidden></div>
        </div>
        <button class="btn" id="btnQuickMemo" type="button">＋ 备忘</button>
        <span class="date" id="topDate"></span>
      </header>
      <div class="quota-bar" id="quotaBar" hidden role="alert">
        <span class="qb-msg" id="qbWarn">⚠ 数据已达 <b class="qb-usage"></b>，接近浏览器 5MB 上限。请立即</span>
        <span class="qb-msg" id="qbFail" hidden>⚠ 本地存储写入失败，数据可能无法保存！请立即</span>
        <a href="#" id="qExport" class="qb-link">导出备份</a>
        <span class="qb-msg" id="qbOr">，或</span>
        <a href="#" id="qMigrate" class="qb-link">迁移至 IndexedDB</a>
        <button class="small-btn" id="qClose" title="不再提醒" type="button">✕</button>
      </div>
      <section class="content" id="content"></section>
      <footer class="site-footer">
        <span>Sonder 开源 · <a href="https://github.com/xiaoyu-hue/sonder520" target="_blank" rel="noopener">GitHub 仓库（MIT）</a></span>
        <span aria-hidden="true">·</span>
        <span id="netOnline">已准备就绪，断网亦可使用。</span>
        <span id="netOffline" class="net-offline" hidden>⚠ 当前离线 · 数据保存在本机，操作仍安全</span>
      </footer>
    </div>
  </div>
  <div id="toastWrap"></div>
  <div id="overlayRoot"></div>

  <script src="js/encryption.js" defer></script>
  <script src="js/event-bus.js" defer></script>
  <script src="js/store-stats.js" defer></script>

  <script src="js/store.js" defer></script>

  <script src="js/ui.js" defer></script>
  <script src="js/motion.js" defer></script>
  <script src="js/error-guard.js" defer></script>
  <script src="js/search.js" defer></script>
  <script src="js/quotes.js" defer></script>
  <script src="js/markdown.js" defer></script>

  <script src="js/app.js" defer></script>
